name: PR Project Build

permissions:
  contents: read

# NOTE: Jumoo repos release from "{version}/main" - a branch per Umbraco major. Plain
# "main" is kept in the filter so a re-created main, or a branch that hasn't been moved
# over yet, still builds - a past repo had a workflow that silently never ran because its
# filter didn't match the branch it was meant to watch.
on:
  pull_request:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  config: Release
  # TODO: point these at this repo's package project. The package project is the
  # whole of what ships - not the solution, and not a *.Site test project.
  package_project: ./src/BackChat/BackChat.csproj
  client_folder: ./src/BackChat/Client

jobs:
  build-project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: install client dependencies
        run: npm ci
        working-directory: ${{ env.client_folder }}

      # TODO: drop if the client's package.json has no "format" script.
      - name: check client formatting
        run: npm run format
        working-directory: ${{ env.client_folder }}

      # runs tsc then vite - this is what produces wwwroot, which is gitignored, so it
      # has to happen before the dotnet build picks up static assets.
      - name: build client
        run: npm run build
        working-directory: ${{ env.client_folder }}

      - name: restore
        run: dotnet restore ${{ env.package_project }} --locked-mode

      - name: build
        run: >
          dotnet build ${{ env.package_project }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true

      # TODO: uncomment and set test_project (in env: above) if this repo has a
      # dedicated test project. Restored separately, not --locked-mode: folding it into
      # the package project's locked restore would transitively pin the package's own
      # fast-moving version.
      # - name: restore tests
      #   run: dotnet restore ${{ env.test_project }}
      #
      # - name: test
      #   run: >
      #     dotnet test ${{ env.test_project }}
      #     -c ${{ env.config }} --no-restore
